[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ets2-triple-monitor"
dynamic = ["version"]
description = "Cross-platform configurator that generates multimon_config.sii for Euro Truck Simulator 2 triple-monitor setups"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
ets2-triple-monitor = "ets2_triple_monitor.gui:main"

[tool.setuptools.dynamic]
version = { attr = "ets2_triple_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
