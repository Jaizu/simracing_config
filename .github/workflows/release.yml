name: Build & Release

# Push a tag like v1.0.0 to build Windows / Linux / macOS binaries
# and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach build assets to
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            pyinstaller_args: --onefile --windowed
          # Built on an older Ubuntu so the binary runs on more distros (older glibc).
          # If GitHub retires this image, switch to ubuntu-24.04.
          - os: ubuntu-22.04
            target: linux-x64
            pyinstaller_args: --onefile
          - os: macos-latest   # Apple Silicon (arm64)
            target: macos-arm64
            pyinstaller_args: --windowed
          # Intel Macs: add another entry with an Intel macOS runner label
          # (e.g. macos-15-intel — check GitHub's current runner list).
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries (Linux build only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build with PyInstaller
        run: >
          pyinstaller ${{ matrix.pyinstaller_args }}
          --noconfirm --clean
          --name ETS2-Triple-Monitor
          --paths src
          packaging/run.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release
          cp dist/ETS2-Triple-Monitor.exe release/ETS2-Triple-Monitor-${{ matrix.target }}.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir release
          tar -czf release/ETS2-Triple-Monitor-${{ matrix.target }}.tar.gz -C dist ETS2-Triple-Monitor

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent dist/ETS2-Triple-Monitor.app \
            release/ETS2-Triple-Monitor-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-Triple-Monitor-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
